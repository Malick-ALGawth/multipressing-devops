---
- name: Créer les dossiers de l'application
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/deploy"
    - "{{ app_dir }}/backups"
    - "{{ app_dir }}/monitoring"

- name: Copier les fichiers d'exploitation (Compose, Caddy, scripts)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ item.src }}"
    dest: "{{ app_dir }}/{{ item.dest }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: docker-compose.yml, dest: docker-compose.yml, mode: "0640" }
    - { src: deploy/Caddyfile, dest: deploy/Caddyfile, mode: "0644" }
    - { src: deploy/backup.sh, dest: deploy/backup.sh, mode: "0755" }
    - { src: deploy/deploy.sh, dest: deploy.sh, mode: "0750" }
    - { src: monitoring/, dest: monitoring/, mode: "0644" }

- name: Installer la commande forcée de la clé GitHub Actions (hors du dossier de l'application, propriété de root)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/ssh-gate.sh"
    dest: /usr/local/bin/multipressing-ssh-gate
    owner: root
    group: root
    mode: "0755"

- name: Écrire la configuration de l'environnement (.env)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  # Le tag déployé (APP_TAG) est ensuite géré par deploy.sh : on ne l'écrase pas s'il existe déjà.
  register: app_env_file

- name: Lire la version actuellement déployée
  ansible.builtin.slurp:
    src: "{{ app_dir }}/.deploy-history"
  register: deploy_history
  failed_when: false

- name: Conserver la version déployée dans .env
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/.env"
    regexp: "^APP_TAG="
    line: "APP_TAG={{ (deploy_history.content | b64decode).strip().splitlines()[-1].split(' ')[1] }}"
  when: deploy_history.content is defined

- name: Démarrer les services de base (base de données, proxy, sauvegardes)
  ansible.builtin.command:
    cmd: docker compose up -d db caddy backup
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"
