# Multipressing : application + PostgreSQL + Caddy (HTTPS) + sauvegardes.
# Supervision optionnelle : docker compose --profile monitoring up -d
#
# En production, l'image vient du registre (APP_IMAGE:APP_TAG) ; APP_TAG est écrit par deploy/deploy.sh.
# En local : docker compose up -d --build  (construit l'image à partir du code).

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

# Durcissement commun : aucun gain de privilèges possible dans le conteneur.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multipressing}
      POSTGRES_USER: ${POSTGRES_USER:-multipressing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}
      TZ: Africa/Dakar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    # Aucun port publié : la base n'est pas accessible depuis Internet.

  app:
    image: ${APP_IMAGE:-multipressing}:${APP_TAG:-local}
    build:
      context: .
      args:
        APP_VERSION: ${APP_TAG:-local}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    # L'application n'écrit rien sur le disque : système de fichiers en lecture seule, aucune capacité Linux.
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    mem_limit: 768m
    pids_limit: 200
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Africa/Dakar
      PORT: 3000
      METRICS_PORT: 9464
      APP_VERSION: ${APP_TAG:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-multipressing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-multipressing}
      SESSION_SECRET: ${SESSION_SECRET:?Renseignez SESSION_SECRET dans .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Renseignez ENCRYPTION_KEY dans .env}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
    stop_grace_period: 15s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # Pas de dépendance à « app » : Caddy démarre même si l'application n'est pas encore déployée.
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Renseignez DOMAIN dans .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-multipressing}
      PGUSER: ${POSTGRES_USER:-multipressing}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?Renseignez BACKUP_PASSPHRASE dans .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      # Copie hors du serveur (facultatif) : stockage compatible S3 décrit par les variables rclone.
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      TZ: Africa/Dakar
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

  # ---------- Supervision (profil « monitoring ») ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: [monitoring]
    restart: unless-stopped
    logging: *logging
    pid: host
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [monitoring]
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changez-moi}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # Accessible uniquement depuis le serveur (tunnel SSH) : jamais exposé sur Internet.
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
